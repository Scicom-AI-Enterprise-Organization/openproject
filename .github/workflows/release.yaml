name: Release

# Builds the OpenProject "slim" production image (docker/prod/Dockerfile) and pushes it to
# ECR scicom/openproject-dev, for the openproject-dev second instance in AIES-Infra/aies-argocd.
#
# Design notes (differs from the standard deploy-to-eks template, on purpose):
#   - runs-on: ubuntu-latest  — this fork lives in Scicom-AI-Enterprise-Organization, which has
#     no `ubuntu-24.04-x64-big` large runner (the template's label just queues forever here).
#   - version is an explicit input, NOT a git-tag semver bump — the fork carries 300+ upstream
#     OpenProject `v*` tags (highest v17.8.1), so "bump from latest tag" would build v17.8.x.
#     The aies-argocd app pins the image tag directly (no ArgoCD Image Updater), so an explicit
#     version is both correct and simpler. No git tag / GitHub release is created.
#   - single-arch linux/amd64 — the AIES httpd node pool is amd64 (all 28 nodes).
#   - file: ./docker/prod/Dockerfile, target: slim — no root Dockerfile; the all-in-one target
#     does NOT boot under the Helm chart.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version to build and push (e.g. 0.0.1)"
        required: true
        default: "0.0.1"

permissions:
  contents: read
  id-token: write        # required to assume AWS_ROLE_ARN over GitHub OIDC

env:
  AWS_REGION: ap-southeast-5
  ECR_REGISTRY: 865626945255.dkr.ecr.ap-southeast-5.amazonaws.com
  ECR_REPOSITORY: scicom/openproject-dev
  AWS_ROLE_ARN: arn:aws:iam::865626945255:role/Scicom-OpenprojectDev-ECRAccessRole

jobs:
  build:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Free up disk space
        run: |
          # OpenProject's slim image is large (Ruby gems + Angular build); the default
          # runner root fs is tight, so drop preinstalled toolchains we don't need.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          docker image prune -af || true
          df -h /

      - id: ver
        run: |
          V="${{ inputs.version }}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "major_minor=${V%.*}" >> "$GITHUB_OUTPUT"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/prod/Dockerfile
          target: slim
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.ver.outputs.version }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.ver.outputs.major_minor }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=build-linux-amd64
          cache-to: type=gha,mode=max,scope=build-linux-amd64
