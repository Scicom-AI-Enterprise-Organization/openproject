name: Release

# Builds the OpenProject "slim" production image from docker/prod/Dockerfile and pushes
# it to the scicom/openproject-dev ECR repo (used by the openproject-dev second instance
# in AIES-Infra/aies-argocd). Single-arch amd64 — the AIES httpd node pool (all 28 nodes)
# is amd64, so the template's arm64 matrix entry + manifest-merge job are dropped.
#
# IMPORTANT build args (differ from the standard deploy-to-eks template):
#   file:   ./docker/prod/Dockerfile   (no Dockerfile in repo root)
#   target: slim                        (all-in-one target does NOT boot under the Helm chart)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  id-token: write        # required to assume AWS_ROLE_ARN over GitHub OIDC

env:
  AWS_REGION: ap-southeast-5
  ECR_REGISTRY: 865626945255.dkr.ecr.ap-southeast-5.amazonaws.com
  ECR_REPOSITORY: scicom/openproject-dev
  AWS_ROLE_ARN: arn:aws:iam::865626945255:role/Scicom-OpenprojectDev-ECRAccessRole

jobs:
  version:
    name: Compute Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      prev_tag: ${{ steps.bump.outputs.prev_tag }}
      major_minor: ${{ steps.bump.outputs.major_minor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: bump
        run: |
          BUMP="${{ inputs.bump }}"
          LATEST_TAG=$(git tag -l "v*" --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            CURRENT="0.0.0"
          else
            CURRENT=$(echo "$LATEST_TAG" | sed "s/v//")
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${NEXT}"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prev_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"
          echo "major_minor=${MAJOR}.${MINOR}" >> "$GITHUB_OUTPUT"

      - name: Create and push tag
        run: |
          git tag "${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    name: Build (linux/amd64)
    needs: version
    runs-on: ubuntu-24.04-x64-big
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Ensure Docker access
        run: |
          if ! command -v docker &> /dev/null; then
            curl -fsSL https://get.docker.com | sh
          fi
          sudo systemctl start docker || true
          sudo usermod -aG docker "$USER"
          sudo chmod 666 /var/run/docker.sock

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/prod/Dockerfile
          target: slim
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.version.outputs.version }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ needs.version.outputs.major_minor }}
            ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=build-linux-amd64
          cache-to: type=gha,mode=max,scope=build-linux-amd64

  release:
    name: Create Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.version.outputs.tag }}"
          VERSION="${{ needs.version.outputs.version }}"
          PREV_TAG="${{ needs.version.outputs.prev_tag }}"
          RELEASE_ARGS=("$TAG" --title "v${VERSION}" --generate-notes --latest=false)
          if [ -n "$PREV_TAG" ]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "${RELEASE_ARGS[@]}"
